name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: mkdir _site && cp index.html config.js backend.js decorations.js boss.js bamboo.js bamboo-courses.js about.html privacy.html tips.html course-guide.html news.html robots.txt sitemap.xml manifest.webmanifest og.png icon.png _site/ && cp -R decor gimmick _site/
      - name: Make browsers fetch fresh scripts after each deploy
        run: sed -i "s#src=\"config.js\"#src=\"config.js?v=${GITHUB_SHA::8}\"#; s#src=\"backend.js\"#src=\"backend.js?v=${GITHUB_SHA::8}\"#; s#src=\"decorations.js\"#src=\"decorations.js?v=${GITHUB_SHA::8}\"#; s#src=\"boss.js\"#src=\"boss.js?v=${GITHUB_SHA::8}\"#" _site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
